# Province-plate profile (three printed lines: header / lot + class / serial). Real-layout profile, measured on photographed Kathmandu-valley plates (Kaggle ishworsubedii/vehicle-number-plate-
# datasetnepal, Apache-2.0) on 2026-09-26. It answers OQ-7 and OQ-10 for old-style two-line plates as observed there:
#   * the top line carries zone, lot AND class ("बा ५८ प", often printed "बा.५८ प"), the serial sits alone below;
#   * the lot has no leading zero ("बा २ ज");
#   * private plates are red with white text and are the majority; black, green and blue plates also occur.
# Province (three-line) and embossed Latin plates are NOT generated here.
# plates.yaml stays the original composition so the seed-42 corpus keeps reproducing.
# Base: Nepali plate composition. DATASET_SPEC.md section 6.1.
#
# Everything under `open_questions` below is OQ-7 to OQ-10: it is a CONFIGURATION value,
# never a hard-coded constant, precisely because this spec is not certain of it. Correcting
# any of it is a YAML edit and a regeneration, not a code change.
#
# The one composition confirmed by a primary source is MEASUREMENTS.md section 4:
#   बा १२ प १२३४  ->  zone BA, lot 12, class PA, serial 1234

digits: ["०", "१", "२", "३", "४", "५", "६", "७", "८", "९"]

# OQ-8. Only "बा" is confirmed (MEASUREMENTS.md section 4). The rest are the fourteen
# administrative zones the series is built on; their exact orthography is unverified.
zones:
  confirmed: ["बा"]
  unverified: ["मे", "को", "सा", "ज", "ना", "ग", "धौ", "लु", "रा", "भे", "से", "म", "क"]

# OQ-9. Only "प" is confirmed (MEASUREMENTS.md section 4).
vehicle_classes:
  confirmed: ["प"]
  unverified: ["च", "ख", "स", "ह", "ब", "ज", "य"]

# OQ-10. Colour-to-ownership mapping is NOT asserted. These are rendering variants only;
# the `name` is a rendering label, not a claim about which ownership class it denotes.
colour_series:
  - {name: red_white, background: [196, 28, 36], text: [245, 245, 245], weight: 0.55}
  - {name: black_white, background: [25, 25, 25], text: [235, 235, 235], weight: 0.15}
  - {name: green_white, background: [20, 130, 70], text: [245, 245, 245], weight: 0.10}
  - {name: blue_white, background: [30, 40, 170], text: [245, 245, 245], weight: 0.08}
  - {name: white_black, background: [235, 235, 235], text: [20, 20, 20], weight: 0.07}
  - {name: orange_white, background: [214, 110, 60], text: [245, 245, 245], weight: 0.05}

layout:
  lines: 3                 # province motorbike plates; plates_province_2line.yaml has lot, class and serial on one line
  top_line: province       # header "बागमती प्रदेश-०२" over lot + class over serial
  zone_dot_probability: 0.5
  plate_width_px: 520
  plate_height_px: 300
  margin_px: 22
  line_gap_px: 14
  corner_radius_px: 16
  border_px: 5
  render_supersample: 4    # render at 4x then INTER_AREA down
  emboss_offset_px: [1, 2]
  rivets: true

lot_number:
  min: 1
  max: 99                  # printed without a leading zero in this layout

serial:
  digits: 4

# Province headers as printed (Devanagari needs complex shaping: render with Pillow + libraqm, see gen_plates.py).
# "प्रदेश ३" is the older numbered name still seen on Kathmandu plates.
provinces:
  - {name: "बागमती प्रदेश", weight: 0.55}
  - {name: "प्रदेश ३", weight: 0.10}
  - {name: "कोशी प्रदेश", weight: 0.06}
  - {name: "मधेश प्रदेश", weight: 0.05}
  - {name: "गण्डकी प्रदेश", weight: 0.07}
  - {name: "लुम्बिनी प्रदेश", weight: 0.07}
  - {name: "कर्णाली प्रदेश", weight: 0.04}
  - {name: "सुदूरपश्चिम प्रदेश", weight: 0.06}
province_office_max: 4
province_lot_max: 99

split:
  val_share: 0.10
  by: serial               # no serial appears in both files
